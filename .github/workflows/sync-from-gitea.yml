name: Sync from Gitea

on:
  schedule:
    - cron: '0 * * * *' # 每小时同步一次，你可以调整 cron 表达式
  workflow_dispatch: # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config --global user.email "qizxxxxx#gmail.com"
          git config --global user.name "GitHub Sync Bot"
          git remote add gitea https://git.wosb.cc/qiz/doc.git

      - name: Pull from Gitea and push to GitHub
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }} # Gitea 个人访问令牌，需要作为 Secret 配置
        run: |
          # 为了防止认证信息暴露在日志中，使用 token 在 URL 中进行认证
          git remote set-url gitea https://qiz:${{ env.GITEA_TOKEN }}@git.wosb.cc/qiz/doc.git
          git pull gitea master --rebase # 假设主分支是 master，可以根据实际情况修改
          git push origin master --force # 强制推送到 GitHub，确保同步
